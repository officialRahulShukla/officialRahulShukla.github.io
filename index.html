<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rahul Shukla | Official</title>
    <style>
        body { 
            margin: 0; 
            font-family: 'Poppins', sans-serif; 
            /* Premium Gradient Background */
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d); 
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            text-align: center; 
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .card { 
            /* Glassmorphism Effect */
            background: rgba(255, 255, 255, 0.1); 
            backdrop-filter: blur(15px); 
            -webkit-backdrop-filter: blur(15px);
            padding: 40px; 
            border-radius: 30px; 
            border: 1px solid rgba(255, 255, 255, 0.2); 
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); 
            width: 85%; 
            max-width: 360px; 
            color: white;
        }
        img { 
            width: 120px; 
            height: 120px; 
            border-radius: 50%; 
            object-fit: cover; 
            border: 3px solid rgba(255, 255, 255, 0.5); 
            margin-bottom: 15px; 
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
        }
        h1 { 
            margin: 10px 0 5px; 
            font-size: 2rem; 
            font-weight: 700;
            letter-spacing: 1px;
        }
        p { color: rgba(255, 255, 255, 0.8); margin-bottom: 30px; font-size: 0.9rem; }
        .btn { 
            display: block; 
            text-decoration: none; 
            color: white; 
            background: rgba(255, 255, 255, 0.15); 
            padding: 14px; 
            margin: 12px 0; 
            border-radius: 15px; 
            border: 1px solid rgba(255, 255, 255, 0.2); 
            font-weight: 600; 
            transition: 0.3s ease; 
        }
        .btn:hover { 
            background: rgba(255, 255, 255, 0.3); 
            transform: translateY(-3px); 
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="Gemini_Generated_Image_c101ryc101ryc101.png" alt="Rahul Shukla">
        <h1>Rahul Shukla</h1>
        <p>Official Digital Presence</p>
        <div class="links">
            <a href="https://www.instagram.com/rahulshukla.2?igsh=MWpuNTRwZ2d6ZTl2dQ==" class="btn">Follow on Instagram</a>
            <a href="https://www.facebook.com/share/1DvtWBu1kC/" class="btn">Connect on Facebook</a>
        </div>
    </div>
</body>
</html>
