<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rahul Shukla | Official</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            overflow: hidden;
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Sitare banane ka tarika */
        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            z-index: 0;
        }

        .stars::after {
            content: "";
            position: absolute;
            top: -10rem;
            left: -10rem;
            width: calc(100% + 20rem);
            height: calc(100% + 20rem);
            background-image: radial-gradient(2px 2px at 20px 30px, #eee, rgba(0,0,0,0)),
                              radial-gradient(2px 2px at 40px 70px, #fff, rgba(0,0,0,0)),
                              radial-gradient(2px 2px at 50px 160px, #ddd, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 200px 200px;
            animation: starsAnim 4s infinite alternate;
        }

        @keyframes starsAnim {
            from { opacity: 0.3; }
            to { opacity: 0.8; }
        }

        .card {
            position: relative;
            z-index: 1;
            background: rgba(10, 10, 10, 0.9);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid #d4af37;
            text-align: center;
            width: 85%;
            max-width: 350px;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.3);
        }

        img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #d4af37;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.6);
            margin-bottom: 20px;
        }

        h1 {
            color: #d4af37;
            margin: 10px 0;
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .btn {
            display: block;
            text-decoration: none;
            color: #d4af37;
            background: transparent;
            padding: 12px;
            margin: 15px 0;
            border-radius: 8px;
            border: 1px solid #d4af37;
            font-weight: bold;
            transition: 0.4s;
        }

        .btn:hover {
            background: #d4af37;
            color: #000;
            box-shadow: 0 0 15px #d4af37;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="stars"></div>
    <div class="card">
        <img src="Gemini_Generated_Image_c101ryc101ryc101.png" alt="Rahul Shukla">
        <h1>Rahul Shukla</h1>
        <p style="color: #888; letter-spacing: 1px;">OFFICIAL PROFILE</p>
        <div class="links">
            <a href="https://www.instagram.com/rahulshukla.2?igsh=MWpuNTRwZ2d6ZTl2dQ==" class="btn">INSTAGRAM</a>
            <a href="https://www.facebook.com/share/1DvtWBu1kC/" class="btn">FACEBOOK</a>
        </div>
    </div>
</body>
</html>
