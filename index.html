<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rahul Shukla | Official</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { margin: 0; padding: 0; background: #ffffff; overflow: hidden; font-family: 'Poppins', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; }
        
        /* Stars on White Background */
        .stars-container { position: absolute; width: 100%; height: 100%; background: #ffffff; overflow: hidden; z-index: 0; }
        .star { position: absolute; background: #d4af37; border-radius: 50%; opacity: 0.3; animation: moveStars linear infinite; }
        
        @keyframes moveStars { 
            from { transform: translateY(0); } 
            to { transform: translateY(-110vh); } 
        }

        .card { 
            position: relative; 
            z-index: 1; 
            background: rgba(255, 255, 255, 0.9); 
            padding: 40px; 
            border-radius: 25px; 
            border: 2px solid #d4af37; 
            text-align: center; 
            width: 85%; 
            max-width: 360px; 
            box-shadow: 0 15px 35px rgba(212, 175, 55, 0.2); 
            backdrop-filter: blur(10px); 
            animation: fadeIn 2s ease-in-out; 
        }
        
        img { 
            width: 130px; 
            height: 130px; 
            border-radius: 50%; 
            border: 3px solid #d4af37; 
            padding: 5px; 
            box-shadow: 0 5px 20px rgba(212, 175, 55, 0.3); 
            margin-bottom: 20px; 
        }

        .name-container { display: flex; align-items: center; justify-content: center; gap: 8px; }
        h1 { color: #333; margin: 0; font-size: 1.8rem; text-transform: uppercase; letter-spacing: 2px; }
        .verified-tick { color: #1DA1F2; font-size: 1.2rem; }

        .bio { color: #666; font-size: 0.85rem; margin: 15px 0 25px; letter-spacing: 1.5px; font-weight: 500; }

        .btn { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 10px; 
            text-decoration: none; 
            color: #d4af37; 
            background: #fff; 
            padding: 14px; 
            margin: 15px 0; 
            border-radius: 12px; 
            border: 2px solid #d4af37; 
            font-weight: bold; 
            transition: 0.4s; 
            text-transform: uppercase; 
        }
        
        .btn:hover { 
            background: #d4af37; 
            color: #fff; 
            box-shadow: 0 8px 20px rgba(212, 175, 55, 0.4); 
            transform: translateY(-5px); 
        }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>
    <div class="stars-container" id="starsContainer"></div>
    <div class="card">
        <img src="Gemini_Generated_Image_c101ryc101ryc101.png" alt="Rahul Shukla">
        <div class="name-container">
            <h1>Rahul Shukla</h1>
            <i class="fas fa-check-circle verified-tick"></i>
        </div>
        <p class="bio">Digital Creator | Official Profile</p>
        
        <div class="links">
            <a href="https://www.instagram.com/rahulshukla.2?igsh=MWpuNTRwZ2d6ZTl2dQ==" class="btn">
                <i class="fab fa-instagram"></i> Instagram
            </a>
            <a href="https://www.facebook.com/share/1DvtWBu1kC/" class="btn">
                <i class="fab fa-facebook"></i> Facebook
            </a>
        </div>
    </div>

    <script>
        const container = document.getElementById('starsContainer');
        const starCount = 200; 

        for (let i = 0; i < starCount; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            const size = (Math.random() * 3) + 'px';
            star.style.width = size;
            star.style.height = size;
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.animationDuration = (Math.random() * 10 + 5) + 's';
            container.appendChild(star);
        }
    </script>
</body>
</html>
