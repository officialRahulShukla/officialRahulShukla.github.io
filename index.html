<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rahul Shukla | Official</title>
    <style>
        /* Naya Stylish Background */
        body { 
            margin: 0; 
            font-family: 'Poppins', sans-serif; 
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e); 
            color: white; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            text-align: center; 
        }
        .card { 
            background: rgba(255, 255, 255, 0.05); 
            padding: 40px; 
            border-radius: 30px; 
            backdrop-filter: blur(15px); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            box-shadow: 0 25px 50px rgba(0,0,0,0.5); 
            width: 85%; 
            max-width: 380px; 
        }
        img { 
            width: 130px; 
            height: 130px; 
            border-radius: 50%; 
            object-fit: cover; 
            border: 4px solid #00d2ff; 
            box-shadow: 0 0 25px rgba(0, 210, 255, 0.5); 
            margin-bottom: 15px; 
        }
        h1 { 
            margin: 10px 0 5px; 
            font-size: 2.2rem; 
            letter-spacing: 1px;
            background: linear-gradient(to right, #00d2ff, #3a7bd5); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
        }
        p { color: #ccc; margin-bottom: 25px; font-style: italic; }
        .btn { 
            display: block; 
            text-decoration: none; 
            color: white; 
            background: rgba(255, 255, 255, 0.1); 
            padding: 14px; 
            margin: 12px 0; 
            border-radius: 50px; 
            border: 1px solid #00d2ff; 
            font-weight: 600; 
            transition: 0.4s ease; 
        }
        .btn:hover { 
            background: #00d2ff; 
            color: #0f0c29; 
            transform: scale(1.05); 
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.6); 
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="Gemini_Generated_Image_c101ryc101ryc101.png" alt="Rahul Shukla">
        <h1>Rahul Shukla</h1>
        <p>Official Digital Identity</p>
        <div class="links">
            <a href="https://www.instagram.com/rahulshukla.2?igsh=MWpuNTRwZ2d6ZTl2dQ==" class="btn">Instagram Profile</a>
            <a href="#" class="btn">WhatsApp Message</a>
        </div>
    </div>
</body>
</html>
