<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rahul Shukla | Official</title>
    <style>
        @keyframes goldGlow {
            0% { box-shadow: 0 0 10px rgba(212, 175, 55, 0.4); }
            50% { box-shadow: 0 0 25px rgba(212, 175, 55, 0.8); }
            100% { box-shadow: 0 0 10px rgba(212, 175, 55, 0.4); }
        }
        body { 
            margin: 0; 
            font-family: 'Poppins', sans-serif; 
            background: radial-gradient(circle, #1a1a1a 0%, #000000 100%); 
            color: #d4af37; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            overflow: hidden;
        }
        .card { 
            background: #0a0a0a; 
            padding: 40px; 
            border-radius: 20px; 
            border: 1px solid #d4af37; 
            text-align: center;
            width: 85%; 
            max-width: 350px;
            animation: fadeIn 1.5s ease-in-out;
        }
        img { 
            width: 120px; 
            height: 120px; 
            border-radius: 50%; 
            object-fit: cover; 
            border: 3px solid #d4af37; 
            animation: goldGlow 3s infinite;
            margin-bottom: 15px;
        }
        h1 { 
            margin: 10px 0; 
            font-size: 1.8rem; 
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
        }
        .btn { 
            display: block; 
            text-decoration: none; 
            color: #d4af37; 
            background: transparent; 
            padding: 12px; 
            margin: 15px 0; 
            border-radius: 5px; 
            border: 1px solid #d4af37; 
            font-weight: bold; 
            transition: all 0.4s; 
        }
        .btn:hover { 
            background: #d4af37; 
            color: #000; 
            transform: scale(1.05);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="Gemini_Generated_Image_c101ryc101ryc101.png" alt="Rahul Shukla">
        <h1>Rahul Shukla</h1>
        <p style="color: #888; font-size: 0.8rem; letter-spacing: 2px;">OFFICIAL PROFILE</p>
        <div class="links">
            <a href="https://www.instagram.com/rahulshukla.2?igsh=MWpuNTRwZ2d6ZTl2dQ==" class="btn">INSTAGRAM</a>
            <a href="https://wa.me/91XXXXXXXXXX" class="btn">WHATSAPP</a>
        </div>
    </div>
</body>
</html>
